# Netlify builds the Astro site in site/ and serves site/dist/.

[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    # The page may only talk to itself and Discord's public game-name endpoints,
    # so the "your package never leaves your browser" promise is enforced by
    # the browser, not just stated. Inline styles are Astro's per-page CSS.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self' https://discord.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Hashed build assets never change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
